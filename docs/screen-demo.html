<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaiseTechChat 画面デモ</title>
<style>
  :root {
    --demo-bg: #1f2328;
    --demo-fg: #e6edf3;
    --demo-muted: #9aa4ae;
    --demo-accent: #f2c744;
    --side-bg: #3f0e40;
    --side-fg: #cfc3cf;
    --side-hover: #350d36;
    --side-active: #1164a3;
    --main-bg: #ffffff;
    --page-bg: #f4f4f6;
    --text: #1d1c1d;
    --muted: #616061;
    --border: #dddddd;
    --primary: #007a5a;
    --primary-hover: #148567;
    --danger: #c0392b;
    --badge: #e01e5a;
    --hint-bg: #fff8e1;
    --hint-border: #e0b84c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--page-bg);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; }
  a { color: #1264a3; cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- デモ用の操作バー ---------- */
  #demobar {
    background: var(--demo-bg);
    color: var(--demo-fg);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
    font-size: 13px;
  }
  /* モーダルを開いていても、デモ用の操作バーは押せるようにする */
  #demobar, #demonote { position: relative; z-index: 30; }
  #demobar .tag { color: var(--demo-accent); font-weight: 700; }
  #demobar .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #demobar .group-label { color: var(--demo-muted); margin-right: 2px; }
  #demobar button {
    background: #2d333b;
    color: var(--demo-fg);
    border: 1px solid #444c56;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 12px;
  }
  #demobar button:hover { background: #3a424c; }
  #demobar button.current { background: var(--demo-accent); color: #1f2328; border-color: var(--demo-accent); font-weight: 700; }
  #demobar select { font-size: 12px; padding: 1px 4px; border-radius: 4px; }
  #demonote {
    background: #2d333b;
    color: var(--demo-fg);
    padding: 6px 12px;
    font-size: 13px;
    border-bottom: 1px solid #444c56;
  }
  #demonote b { color: var(--demo-accent); margin-right: 8px; }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- 共通部品 ---------- */
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 7px 14px;
    font-weight: 600;
  }
  .btn:hover { background: #f6f6f6; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
  .btn.danger.solid { background: var(--danger); color: #fff; }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  .btn.block { width: 100%; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .field input[type=text], .field input[type=email], .field input[type=password], .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
  }
  .error { color: var(--danger); font-size: 14px; margin: 0 0 12px; }
  .success { color: var(--primary); font-size: 14px; margin: 0 0 12px; }
  .hint {
    background: var(--hint-bg);
    border: 1px dashed var(--hint-border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    color: #6b5300;
    margin: 10px 0;
  }
  .hint::before { content: "デモ解説："; font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .avatar {
    width: 36px; height: 36px; border-radius: 6px;
    color: #fff; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .avatar.sm { width: 24px; height: 24px; font-size: 12px; border-radius: 4px; }
  .role {
    font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    background: #e8e8e8; color: #444;
  }
  .role.OWNER { background: #fde2e1; color: #a12a20; }
  .role.ADMIN { background: #dbeafe; color: #1e4fa0; }

  /* ---------- 認証まわり（S01〜S04、S06、S07） ---------- */
  .auth { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow: auto; }
  .auth-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 28px; width: 100%; max-width: 400px; }
  .auth-card .logo { font-weight: 800; color: var(--side-bg); text-align: center; margin-bottom: 4px; }
  .auth-card h1 { font-size: 22px; text-align: center; margin: 0 0 20px; }
  .auth-card .links { margin-top: 16px; font-size: 14px; text-align: center; line-height: 1.9; }

  /* ---------- S05 ワークスペース選択 ---------- */
  .topbar { background: var(--side-bg); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }
  .topbar .logo { font-weight: 800; }
  .topbar a { color: #fff; font-size: 14px; }
  .ws-page { flex: 1; overflow: auto; padding: 32px 16px; }
  .ws-page-inner { max-width: 560px; margin: 0 auto; }
  .ws-page h1 { font-size: 22px; margin: 0 0 16px; }
  .ws-list { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .ws-item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .ws-item:last-child { border-bottom: 0; }
  .ws-item:hover { background: #f8f8f8; }
  .ws-item .ws-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--side-bg); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .ws-item .ws-name { font-weight: 700; }
  .ws-item .chev { margin-left: auto; color: var(--muted); }

  /* ---------- S08 チャット ---------- */
  .chat { flex: 1; min-height: 0; display: flex; }
  .sidebar { width: 260px; background: var(--side-bg); color: var(--side-fg); display: flex; flex-direction: column; flex-shrink: 0; position: relative; }
  .ws-header {
    color: #fff; font-weight: 800; font-size: 17px; padding: 12px 16px;
    border-bottom: 1px solid #5a2a5b; cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left;
  }
  .ws-header:hover { background: var(--side-hover); }
  .ws-menu {
    position: absolute; top: 48px; left: 12px; right: 12px; z-index: 5;
    background: #fff; color: var(--text); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); padding: 6px 0;
  }
  .ws-menu a { display: block; padding: 7px 16px; color: var(--text); font-size: 14px; }
  .ws-menu a:hover { background: var(--side-active); color: #fff; text-decoration: none; }
  .ws-menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .side-scroll { flex: 1; overflow: auto; padding: 10px 0; }
  .side-section { margin-bottom: 14px; }
  .side-title { display: flex; justify-content: space-between; align-items: center; padding: 2px 16px; font-size: 14px; }
  .side-title button { background: none; border: 0; color: var(--side-fg); font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .side-title button:hover { background: var(--side-hover); color: #fff; }
  .side-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 16px; font-size: 15px;
    color: var(--side-fg); cursor: pointer; text-decoration: none;
  }
  .side-item:hover { background: var(--side-hover); text-decoration: none; }
  .side-item.active { background: var(--side-active); color: #fff; }
  .side-item.unread { color: #fff; font-weight: 700; }
  .side-item .icon { width: 16px; text-align: center; opacity: .8; flex-shrink: 0; font-size: 13px; }
  .side-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .badge { margin-left: auto; background: var(--badge); color: #fff; font-size: 12px; font-weight: 700; border-radius: 9px; padding: 0 7px; }
  .side-item.sub { opacity: .8; font-size: 14px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--main-bg); }
  .main-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 8px; }
  .main-header .title { font-weight: 800; font-size: 17px; background: none; border: 0; padding: 4px 6px; border-radius: 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-header .title:hover { background: #f2f2f2; }
  .messages { flex: 1; overflow-y: auto; padding: 8px 0; }
  .loader { text-align: center; padding: 8px; font-size: 13px; color: var(--muted); }
  .channel-start { padding: 16px 20px 8px; }
  .channel-start h2 { margin: 0 0 4px; font-size: 20px; }
  .msg { display: flex; gap: 10px; padding: 6px 20px; position: relative; }
  .msg:hover { background: #f8f8f8; }
  .msg-body { min-width: 0; flex: 1; }
  .msg-meta b { margin-right: 8px; }
  .msg-meta .time { color: var(--muted); font-size: 12px; }
  .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .edited { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .msg-actions { position: absolute; top: 2px; right: 16px; display: none; gap: 4px; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .msg:hover .msg-actions { display: flex; }
  .msg-actions button { background: none; border: 0; font-size: 13px; padding: 2px 8px; border-radius: 4px; }
  .msg-actions button:hover { background: #eee; }
  .msg-actions button.del { color: var(--danger); }
  .msg.new { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: #fff4c2; } to { background: transparent; } }
  .edit-box textarea { width: 100%; border: 1px solid #b5b5b5; border-radius: 6px; padding: 8px; min-height: 60px; }
  .edit-box .row { justify-content: flex-start; margin-top: 6px; }
  .composer { padding: 0 16px 16px; }
  .composer form { border: 1px solid #b5b5b5; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px; gap: 6px; }
  .composer textarea { flex: 1; border: 0; resize: none; outline: none; padding: 6px; min-height: 38px; max-height: 160px; }
  .composer .muted { margin-top: 4px; }

  /* ---------- S09 メンバー管理 ---------- */
  .page { flex: 1; overflow: auto; background: #fff; }
  .page-inner { max-width: 760px; margin: 0 auto; padding: 16px; }
  .page h1 { font-size: 22px; margin: 16px 0; }
  .member-table { width: 100%; border-collapse: collapse; }
  .member-table th, .member-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .member-table th { font-size: 13px; color: var(--muted); }
  .member-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .danger-zone { border: 1px solid #f0c4bf; border-radius: 8px; padding: 14px 16px; margin-top: 28px; }
  .danger-zone h2 { font-size: 16px; margin: 0 0 8px; color: var(--danger); }

  /* ---------- モーダル ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: calc(var(--bar-h, 100px) + 24px) 16px 24px; z-index: 20; overflow: auto; }
  .modal { background: #fff; border-radius: 10px; width: 100%; max-width: 480px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; }
  .modal-head h2 { margin: 0; font-size: 19px; }
  .modal-head .close { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  .modal-head .close:hover { background: #eee; }
  .modal-body { padding: 8px 20px 20px; }
  .modal-body h3 { font-size: 14px; margin: 16px 0 6px; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .list-item:last-child { border-bottom: 0; }
  .list-item .grow { flex: 1; min-width: 0; }
  .radio { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 14px; }
  .invite-url { display: flex; gap: 6px; }
  .invite-url input { flex: 1; padding: 8px; border: 1px solid #b5b5b5; border-radius: 6px; background: #f8f8f8; font-size: 13px; }
  .quote { border-left: 4px solid var(--border); padding: 6px 10px; margin: 8px 0 12px; white-space: pre-wrap; word-break: break-word; background: #fafafa; }
  .actions-col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-top: 16px; }
  .confirm { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }

  @media (max-width: 640px) {
    .sidebar { width: 170px; }
    .side-item, .side-title { padding-left: 10px; padding-right: 8px; }
    .msg { padding: 6px 10px; }
    .member-table .email { display: none; }
  }
</style>
</head>
<body>

<script>

// =========================================================
// ヘルパー
// =========================================================
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function avatar(userId, cls = '') {
  const u = USERS[userId];
  return `<span class="avatar ${cls}" style="background:${u.color}">${esc(u.name[0])}</span>`;
}
function curWs() { return db.workspaces.find(w => w.id === state.workspaceId); }
function myWorkspaces() { return db.workspaces.filter(w => w.members.some(m => m.userId === ME)); }
function roleOf(ws, userId) { return ws?.members.find(m => m.userId === userId)?.role; }
function myRole() { return roleOf(curWs(), ME); }
function wsChannels() { return db.channels.filter(c => c.ws === state.workspaceId); }
function joined(ch) { return ch.members.includes(ME); }
function curChannel() { return db.channels.find(c => c.id === state.channelId); }
function generalOf(wsId) { return db.channels.find(c => c.ws === wsId && c.general); }
function chLabel(ch) {
  if (ch.type === 'DM') {
    const others = ch.members.filter(id => id !== ME);
    // 自分だけのDM（メモ用）は自分の名前を表示する
    return others.length ? others.map(id => USERS[id].name).join('、') : `${USERS[ME].name}（あなた）`;
  }
  return ch.name;
}
// DMは自分を含めて9人まで（仕様のルール）
const MAX_DM_OTHERS = 8;
function chIcon(ch) {
  if (ch.type === 'PUBLIC') return '#';
  if (ch.type === 'PRIVATE') return '🔒';
  return ch.members.length > 2 ? '👥' : '●';
}
function chTitle(ch) { return ch.type === 'DM' ? chLabel(ch) : `${chIcon(ch)} ${ch.name}`; }
function nowTime() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}
// 権限表（docs/permissions.md）のうち、画面のボタン表示に関わるもの
function can(action) {
  const role = myRole();
  switch (action) {
    case 'makePrivate': return role === 'OWNER' || role === 'ADMIN';
    case 'changeRole': return role === 'OWNER';
    case 'deleteWorkspace': return role === 'OWNER';
    default: return false;
  }
}

// =========================================================
// 画面遷移
// =========================================================
function go(id, extra = {}) {
  Object.assign(state, { error: null, flash: null, sub: null, sent: false, invalidLink: false, menuOpen: false, editingId: null, targetId: null }, extra);
  // 招待リンクはモーダルを開くたびに新しく発行する
  if (id === 'M05') state.inviteToken = null;
  if (location.hash === '#' + id) applyHash();
  else location.hash = id;
}
function applyHash() {
  const id = location.hash.slice(1) || 'S01';
  if (MODALS[id]) {
    state.screen = 'S08';
    state.modal = id;
  } else {
    state.screen = SCREENS[id] ? id : 'S01';
    state.modal = null;
  }
  render();
}
window.addEventListener('hashchange', applyHash);

function openChannel(id) {
  state.channelId = id;
  const ch = curChannel();
  if (ch) ch.unread = 0;
}
// 現在のワークスペース・チャンネルが不正なら、参加している所に寄せる
function ensureContext() {
  if (!curWs() || !roleOf(curWs(), ME)) {
    const ws = myWorkspaces()[0];
    if (ws) state.workspaceId = ws.id;
  }
  const ch = curChannel();
  if (!ch || ch.ws !== state.workspaceId || !joined(ch)) {
    const g = generalOf(state.workspaceId);
    if (g) openChannel(g.id);
  }
}

// =========================================================
// 描画
// =========================================================
const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');

function render() {
  const composer = document.getElementById('composer');
  if (composer) state.drafts[composer.dataset.ch] = composer.value;

  const list = document.querySelector('.messages');
  const prev = list ? { top: list.scrollTop, height: list.scrollHeight, atBottom: list.scrollHeight - list.scrollTop - list.clientHeight < 30 } : null;

  ensureContext();
  if (state.modal && !curChannel()) state.modal = null;
  app.innerHTML = SCREENS[state.screen].render();
  state.newMsgId = null;
  modalRoot.innerHTML = state.modal ? `<div class="backdrop" data-act="close-modal">${MODALS[state.modal].render()}</div>` : '';
  renderDemoBar();

  const newList = document.querySelector('.messages');
  if (newList) {
    if (state.keepScroll === 'older' && prev) newList.scrollTop = newList.scrollHeight - prev.height + prev.top;
    else if (state.keepScroll === 'stay' && prev && !prev.atBottom) newList.scrollTop = prev.top;
    else newList.scrollTop = newList.scrollHeight;
    newList.addEventListener('scroll', onMessagesScroll);
  }
  state.keepScroll = null;

  if (state.focus) {
    const el = document.querySelector(state.focus);
    if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
    state.focus = null;
  }
}

function renderDemoBar() {
  const cur = state.modal || state.screen;
  const btn = id => `<button class="${id === cur ? 'current' : ''}" data-go="${id}" title="${esc((SCREENS[id] || MODALS[id]).name)}">${id}</button>`;
  const ws = curWs();
  const role = myRole();
  document.getElementById('demobar').innerHTML = `
    <span class="tag">画面デモ</span>
    <div class="group"><span class="group-label">画面</span>${Object.keys(SCREENS).map(btn).join('')}</div>
    <div class="group"><span class="group-label">モーダル</span>${Object.keys(MODALS).map(btn).join('')}</div>
    ${ws && role ? `<div class="group"><span class="group-label">自分のロール（${esc(ws.name)}）</span>
      <select id="role-select">${['OWNER', 'ADMIN', 'MEMBER'].map(r => `<option ${r === role ? 'selected' : ''}>${r}</option>`).join('')}</select></div>` : ''}
    ${state.screen === 'S08' ? `<div class="group"><button data-act="simulate">他の人からメッセージを受信（WebSocket）</button></div>` : ''}
  `;
  const def = SCREENS[state.screen];
  const label = state.modal ? `${state.modal} ${MODALS[state.modal].name}` : `${state.screen} ${def.name}`;
  const note = document.getElementById('demonote');
  note.innerHTML = `<b>${esc(label)}</b>${esc(state.modal ? 'モーダルの外側か［×］、Escキーで閉じます。' : def.note)}`;
  // モーダルがデモ用の操作バーの下に隠れないよう、バーの高さを渡す
  document.documentElement.style.setProperty('--bar-h', note.getBoundingClientRect().bottom + 'px');
}

function renderChat() {

          <div class="side-section">
            <div class="side-title">ダイレクトメッセージ<button data-go="M04" title="DMを開始">＋</button></div>
            ${dms.map(item).join('')}

function renderMessages(ch) {
  const msgs = db.messages[ch.id] || [];
  const hasOlder = (db.older[ch.id] || []).length > 0;
  let top;
  if (hasOlder) {
    top = `<div class="loader">${state.loadingOlder ? '読み込み中…' : '<a data-act="load-older">↑ 上にスクロールすると過去のメッセージを読み込みます</a>'}</div>`;
  } else {
    top = `<div class="channel-start"><h2>${esc(chTitle(ch))}</h2>
      <div class="muted">${ch.type === 'DM' ? 'ここがダイレクトメッセージの始まりです。' : `ここが ${esc(chTitle(ch))} チャンネルの始まりです。${ch.description ? esc(ch.description) : ''}`}</div></div>`;
  }
  return top + msgs.map(messageHtml).join('');
}

function messageHtml(m) {
  const u = USERS[m.userId];
  const mine = m.userId === ME;
  if (state.editingId === m.id) {
    return `
      <div class="msg">${avatar(m.userId)}
        <div class="msg-body edit-box">
          <form data-form="edit" data-id="${m.id}">
            <textarea id="edit-box" name="content" maxlength="4000">${esc(m.content)}</textarea>
            <div class="row"><button type="button" class="btn small" data-act="cancel-edit">キャンセル</button><button class="btn primary small">保存</button></div>
          </form>
        </div>
      </div>`;
  }
  return `
    <div class="msg ${m.id === state.newMsgId ? 'new' : ''}">${avatar(m.userId)}
      <div class="msg-body">
        <div class="msg-meta"><b>${esc(u.name)}</b><span class="time">${esc(m.time)}</span></div>
        <div class="msg-text">${esc(m.content)}${m.edited ? '<span class="edited">（編集済み）</span>' : ''}</div>
      </div>
      ${mine ? `<div class="msg-actions"><button data-act="edit" data-id="${m.id}">編集</button><button class="del" data-act="delete" data-id="${m.id}">削除</button></div>` : ''}
    </div>`;
}

function onMessagesScroll(e) {
  if (e.target.scrollTop < 20) loadOlder();
}
function loadOlder() {
  const ch = curChannel();
  if (state.loadingOlder || !(db.older[ch.id] || []).length) return;
  state.loadingOlder = true;
  state.keepScroll = 'older';
  render();
  setTimeout(() => {
    db.messages[ch.id] = db.older[ch.id].concat(db.messages[ch.id] || []);
    db.older[ch.id] = [];
    state.loadingOlder = false;
    state.keepScroll = 'older';
    render();
  }, 700);
}

      ${can('deleteWorkspace') ? `

          : `<button class="btn danger" data-act="sub" data-sub="delete-ws">ワークスペースを削除</button>`}

  const ch = curChannel();
  if (!ch) return modal('チャンネル詳細', '');
  const members = ch.members.map(id => `<div class="list-item">${avatar(id, 'sm')}<span class="grow">${esc(USERS[id].name)}${id === ME ? '<span class="muted">（あなた）</span>' : ''}</span></div>`).join('');
  if (ch.type === 'DM') {
    return modal(esc(chTitle(ch)), `<h3>メンバー（${ch.members.length}人）</h3>${members}<p class="hint">DMではメンバーの一覧だけを表示します（編集・メンバー追加・退出はできません）。</p>`);
  }

  const info = state.sub === 'edit'
    ? `<form class="confirm" data-form="channel-edit">
        <div class="field"><label>名前</label><input type="text" name="name" maxlength="80" value="${esc(ch.name)}" ${ch.general ? 'disabled' : ''}></div>
        <div class="field"><label>説明</label><input type="text" name="description" maxlength="250" value="${esc(ch.description || '')}"></div>
        ${errorHtml()}
        <div class="row" style="justify-content:flex-start"><button type="button" class="btn small" data-act="sub" data-sub="">キャンセル</button><button class="btn primary small">保存</button></div>
      </form>`
    : `<div class="row" style="justify-content:space-between;align-items:flex-start">
        <div class="muted">${ch.description ? '説明：' + esc(ch.description) + '<br>' : ''}種別：${ch.type === 'PUBLIC' ? '公開チャンネル' : '非公開チャンネル'}</div>
        <button class="btn small" data-act="sub" data-sub="edit">編集</button>
      </div>`;

  let addArea = '';
  if (ch.type === 'PRIVATE') {
    const candidates = curWs().members.map(m => m.userId).filter(id => !ch.members.includes(id));
    addArea = state.sub === 'add'
      ? `<div class="confirm"><b>メンバーを追加</b>
          ${candidates.length ? candidates.map(id => `<div class="list-item">${avatar(id, 'sm')}<span class="grow">${esc(USERS[id].name)}</span><button class="btn small" data-act="add-member" data-id="${id}">追加</button></div>`).join('')
            : '<p class="muted">追加できるメンバーはいません。</p>'}
          <button class="btn small" data-act="sub" data-sub="">閉じる</button></div>`
      : `<button class="btn" data-act="sub" data-sub="add">メンバーを追加</button>`;
  }

  let privateArea = '';
  if (ch.type === 'PUBLIC' && !ch.general && can('makePrivate')) {
    privateArea = state.sub === 'private'
      ? `<div class="confirm">一度非公開にすると、公開に戻せません。非公開にしますか？
          <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn small" data-act="sub" data-sub="">キャンセル</button><button class="btn danger solid small" data-act="make-private">非公開にする</button></div></div>`
      : `<button class="btn" data-act="sub" data-sub="private">非公開にする</button>`;
  }

  let leaveArea = '';
  if (!ch.general) {
    let warning = '';
    if (ch.type === 'PRIVATE') {
      warning = ch.members.length === 1
        ? '参加者がいなくなり、誰もこのチャンネルを開けなくなります。'
        : '再び参加するには、参加者に追加してもらう必要があります。';
    }
    leaveArea = state.sub === 'leave'
      ? `<div class="confirm">${warning}チャンネルから退出しますか？
          <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn small" data-act="sub" data-sub="">キャンセル</button><button class="btn danger solid small" data-act="leave">退出する</button></div></div>`
      : `<button class="btn danger" data-act="sub" data-sub="leave">チャンネルから退出</button>`;
  }

  const hints = [];
  hints.push('名前・説明は、チャンネルの参加者なら誰でも変更できます（権限表）。');
  if (ch.general) hints.push('#general は非公開化・退出・名前の変更ができないため、ボタンを表示していません（仕様のルール）。');
  else if (ch.type === 'PUBLIC' && !can('makePrivate')) hints.push('［非公開にする］は OWNER・ADMIN だけに表示します（権限表）。上の「自分のロール」で切り替えてみてください。');
  if (ch.type === 'PRIVATE') hints.push('一度非公開にしたチャンネルは公開に戻せないため、［公開にする］ボタンはありません。');
  if (ch.type === 'PUBLIC') hints.push('［メンバーを追加］は非公開チャンネルだけに表示します。公開チャンネルは各自が［チャンネルを探す］から参加します。');

  return modal(esc(chTitle(ch)), `
    ${info}
    <h3>メンバー（${ch.members.length}人）</h3>
    ${members}
    <div class="actions-col">${addArea}${privateArea}${leaveArea}</div>
    ${hints.map(h => `<p class="hint">${esc(h)}</p>`).join('')}`);
}

function renderDmCreate() {
  const others = curWs().members.map(m => m.userId).filter(id => id !== ME);
  return modal('ダイレクトメッセージ', `
    <form data-form="dm-create">
      ${others.map(id => `<label class="list-item"><input type="checkbox" name="users" value="${id}">${avatar(id, 'sm')}<span class="grow">${esc(USERS[id].name)}</span></label>`).join('')}
      ${errorHtml()}
      <p class="hint">1人を選ぶと1対1のDM、2人以上でグループDMになります。誰も選ばずに開始すると、自分だけのDM（メモ用）になります。選べるのは8人まで（自分を含めて9人）です。同じメンバー構成のDMがすでにあれば、新しく作らずにそれを開きます。</p>
      <div class="row"><button type="button" class="btn" data-go="S08">キャンセル</button><button class="btn primary">DMを開始</button></div>
    </form>`);
}

function renderInviteLink() {
  if (!state.inviteToken) state.inviteToken = Math.random().toString(36).slice(2, 12);
  const d = new Date();
  d.setDate(d.getDate() + 30);
  const url = `https://raisetech-chat.example/invite/${state.inviteToken}`;
  return modal('メンバーを招待', `
    <p>このリンクを共有すると、<b>${esc(curWs().name)}</b> に参加できます。</p>
    <div class="invite-url"><input type="text" readonly value="${url}" id="invite-url"><button class="btn primary small" data-act="copy-invite">${state.sub === 'copied' ? 'コピーしました' : 'コピー'}</button></div>
    <p class="muted">有効期限：${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日まで（30日間）。期限内なら何人でも使えます。</p>
    <p class="hint">招待リンクの発行はロールに関係なく全員ができます。リンクを開くと <a data-go="S07">S07 招待参加画面</a> が表示されます。</p>`);
}

function renderDeleteConfirm() {
  const ch = curChannel();
  const msgs = db.messages[ch.id] || [];
  const target = msgs.find(m => m.id === state.targetId) || [...msgs].reverse().find(m => m.userId === ME);
  if (!target) {
    return modal('メッセージを削除しますか？', `<p class="muted">このチャンネルに自分のメッセージがありません。</p><div class="row"><button class="btn" data-go="S08">閉じる</button></div>`);
  }
  state.targetId = target.id;
  return modal('メッセージを削除しますか？', `
    <div class="quote">${esc(target.content)}</div>
    <p class="muted">削除したメッセージは元に戻せません。</p>
    <div class="row"><button class="btn" data-go="S08">キャンセル</button><button class="btn danger solid" data-act="confirm-delete">削除する</button></div>`);
}

// =========================================================
// 操作
// =========================================================
const ACTIONS = {
  'close-modal'() { go('S08'); },
  'toggle-menu'() { state.menuOpen = !state.menuOpen; render(); },
  'toggle-invalid'() { state.invalidLink = !state.invalidLink; state.error = null; render(); },
  sub(d) { state.sub = d.sub || null; state.error = null; state.keepScroll = 'stay'; render(); },
  'enter-ws'(d) {
    state.workspaceId = Number(d.id);
    openChannel(generalOf(state.workspaceId).id);
    go('S08');
  },
  'join-invite'() {
    const ws = db.workspaces.find(w => w.id === 1);
    if (!ws) { go('S05'); return; }
    // デモでは自分はすでに参加済みなので、そのまま #general を開く
    state.workspaceId = ws.id;
    openChannel(generalOf(ws.id).id);
    go('S08');
  },
  'open-channel'(d) { openChannel(Number(d.id)); go('S08', { focus: '#composer' }); },
  'join-channel'(d) {
    const ch = db.channels.find(c => c.id === Number(d.id));
    ch.members.push(ME);
    openChannel(ch.id);
    go('S08', { focus: '#composer' });
  },
  'load-older'() { loadOlder(); },
  edit(d) { state.editingId = Number(d.id); state.keepScroll = 'stay'; state.focus = '#edit-box'; render(); },
  'cancel-edit'() { state.editingId = null; state.keepScroll = 'stay'; render(); },
  delete(d) { go('M06', { targetId: Number(d.id) }); },
  'confirm-delete'() {
    const ch = curChannel();
    db.messages[ch.id] = db.messages[ch.id].filter(m => m.id !== state.targetId);
    go('S08');
  },
  'add-member'(d) { curChannel().members.push(Number(d.id)); render(); },
  'make-private'() { curChannel().type = 'PRIVATE'; state.sub = null; render(); },
  leave() {
    const ch = curChannel();
    ch.members = ch.members.filter(id => id !== ME);
    openChannel(generalOf(state.workspaceId).id);
    go('S08');
  },
  'copy-invite'() {
    const input = document.getElementById('invite-url');
    // クリップボードが使えない環境では、テキストを選択状態にして手動でコピーしてもらう
    try { navigator.clipboard.writeText(input.value).catch(() => input.select()); } catch (e) { input.select(); }
    state.sub = 'copied';
    render();
  },
  'set-role'(d) {
    curWs().members.find(m => m.userId === Number(d.user)).role = d.role;
    render();
  },
  'delete-ws'() {
    const ws = curWs();
    db.workspaces = db.workspaces.filter(w => w.id !== ws.id);
    db.channels = db.channels.filter(c => c.ws !== ws.id);
    go('S05', { flash: `「${ws.name}」を削除しました。` });
  },
  simulate() {
    // 半分は今開いているチャンネル、半分は別のチャンネル・DMに届く
    const others = wsChannels().filter(c => joined(c) && c.id !== state.channelId);
    const toCurrent = !others.length || Math.random() < 0.5;
    const ch = toCurrent ? curChannel() : others[Math.floor(Math.random() * others.length)];
    const senders = ch.members.filter(id => id !== ME);
    if (!senders.length) return;
    const from = senders[Math.floor(Math.random() * senders.length)];
    const texts = ['リアルタイムで届きました！', '確認しました👍', '今から少し席を外します', 'この件、あとで相談させてください', 'ありがとうございます！'];
    const m = { id: nextId++, userId: from, time: nowTime(), content: texts[Math.floor(Math.random() * texts.length)] };
    (db.messages[ch.id] = db.messages[ch.id] || []).push(m);
    if (toCurrent) state.newMsgId = m.id;
    else { ch.unread++; state.keepScroll = 'stay'; }
    render();
  },
};

const FORMS = {
  login(fd) {
    if (!fd.get('email') || !fd.get('password')) { state.error = 'メールアドレスとパスワードを入力してください'; render(); return; }
    go('S05');
  },
  signup(fd) {
    if (!fd.get('name') || !fd.get('email')) { state.error = '表示名とメールアドレスを入力してください'; render(); return; }
    if (fd.get('password').length < 8) { state.error = 'パスワードは8文字以上で入力してください'; render(); return; }
    go('S05');
  },
  'reset-request'(fd) {
    if (!fd.get('email')) { state.error = 'メールアドレスを入力してください'; render(); return; }
    state.sent = true;
    state.error = null;
    render();
  },
  reset(fd) {
    if (fd.get('password').length < 8) { state.error = 'パスワードは8文字以上で入力してください'; render(); return; }
    if (fd.get('password') !== fd.get('confirm')) { state.error = '確認用のパスワードが一致しません'; render(); return; }
    go('S01', { flash: 'パスワードを再設定しました。新しいパスワードでログインしてください。' });
  },
  'ws-create'(fd) {
    const name = fd.get('name').trim();
    if (!name) { state.error = 'ワークスペース名を入力してください'; render(); return; }
    const ws = { id: nextId++, name, members: [{ userId: ME, role: 'OWNER' }] };
    db.workspaces.push(ws);
    const g = { id: nextId++, ws: ws.id, type: 'PUBLIC', name: 'general', general: true, description: '', members: [ME], unread: 0 };
    db.channels.push(g);
    state.workspaceId = ws.id;
    openChannel(g.id);
    go('S08');
  },
  send(fd) {
    const content = fd.get('content');
    if (!content.trim()) return;
    const ch = curChannel();
    (db.messages[ch.id] = db.messages[ch.id] || []).push({ id: nextId++, userId: ME, time: nowTime(), content });
    state.drafts[ch.id] = '';
    document.getElementById('composer').value = '';
    state.error = null;
    state.focus = '#composer';
    render();
  },
  edit(fd, form) {
    const m = db.messages[state.channelId].find(x => x.id === Number(form.dataset.id));
    const content = fd.get('content');
    if (!content.trim()) { state.editingId = null; go('M06', { targetId: m.id }); return; }
    if (content !== m.content) { m.content = content; m.edited = true; }
    state.editingId = null;
    state.keepScroll = 'stay';
    render();
  },
  'channel-create'(fd) {
    const name = fd.get('name').trim();
    if (!name) { state.error = 'チャンネル名を入力してください'; render(); return; }
    if (wsChannels().some(c => c.type !== 'DM' && c.name === name)) { state.error = '同じ名前のチャンネルがすでにあります'; render(); return; }
    const ch = { id: nextId++, ws: state.workspaceId, type: fd.get('type'), name, description: fd.get('description').trim(), members: [ME], unread: 0 };
    db.channels.push(ch);
    openChannel(ch.id);
    go('S08', { focus: '#composer' });
  },
  'channel-edit'(fd) {
    const ch = curChannel();
    if (!ch.general) {
      const name = fd.get('name').trim();
      if (!name) { state.error = 'チャンネル名を入力してください'; render(); return; }
      if (wsChannels().some(c => c.id !== ch.id && c.type !== 'DM' && c.name === name)) { state.error = '同じ名前のチャンネルがすでにあります'; render(); return; }
      ch.name = name;
    }
    ch.description = fd.get('description').trim();
    state.sub = null;
    state.error = null;
    render();
  },
  'dm-create'(fd) {
    // 誰も選ばなければ自分だけのDM（メモ用）になる
    const selected = fd.getAll('users').map(Number);
    if (selected.length > MAX_DM_OTHERS) { state.error = `選べるのは${MAX_DM_OTHERS}人までです`; render(); return; }
    const key = [ME, ...selected].sort((a, b) => a - b).join(',');
    let ch = wsChannels().find(c => c.type === 'DM' && [...c.members].sort((a, b) => a - b).join(',') === key);
    if (!ch) {
      ch = { id: nextId++, ws: state.workspaceId, type: 'DM', members: [ME, ...selected], unread: 0 };
      db.channels.push(ch);
    }
    openChannel(ch.id);
    go('S08', { focus: '#composer' });
  },
};

function setMyRole(role) {
  const ws = curWs();
  const me = ws.members.find(m => m.userId === ME);
  if (role === 'OWNER') {
    // OWNERは1人だけなので、元のOWNERはADMINにする
    ws.members.forEach(m => { if (m.role === 'OWNER') m.role = 'ADMIN'; });
  } else if (me.role === 'OWNER') {
    // 自分がOWNERでなくなる場合は、他の誰かをOWNERにする（デモ用）
    const heir = ws.members.find(m => m.userId !== ME);
    if (heir) heir.role = 'OWNER';
  }
  me.role = role;
  state.keepScroll = 'stay';
  render();
}

// =========================================================
// イベント
// =========================================================
document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'close-modal' && e.target !== el) return;
  e.preventDefault();
  ACTIONS[el.dataset.act](el.dataset, el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  FORMS[e.target.dataset.form](new FormData(e.target), e.target);
});
document.addEventListener('change', e => {
  if (e.target.id === 'role-select') setMyRole(e.target.value);
  // DMの相手は8人まで。上限に達したら残りのチェックボックスを選べないようにする
  if (e.target.name === 'users') {
    const boxes = [...e.target.form.querySelectorAll('input[name="users"]')];
    const full = boxes.filter(b => b.checked).length >= MAX_DM_OTHERS;
    boxes.forEach(b => { if (!b.checked) b.disabled = full; });
  }
});
document.addEventListener('keydown', e => {
  // 日本語入力の変換確定（isComposing）のEnterでは送信しない
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && e.target.matches('[data-enter-submit]')) {
    e.preventDefault();
    e.target.form.requestSubmit();
  }
  if (e.key === 'Escape') {
    if (state.editingId) { state.editingId = null; state.keepScroll = 'stay'; render(); }
    else if (state.modal) go('S08');
  }
});

applyHash();
</script>
